name: Daily Ingestion Pipeline

on:
  schedule:
    - cron: '0 5 * * *'  # 05:00 UTC = 10:30 AM IST
  workflow_dispatch:       # Manual trigger from GitHub UI

permissions:
  contents: write          # Needed to push updated vectorstore

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run ingestion pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m backend.scripts.run_ingestion

      - name: Commit updated vectorstore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backend/vectorstore/ backend/ingestion/parsed_data.json backend/ingestion/chunked_data.json
          git diff --cached --quiet || git commit -m "chore: daily ingestion update $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main || true
          git push
